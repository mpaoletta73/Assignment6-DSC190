[project]
name = "nldate"
version = "0.1.0"
description = "Natural-language date parser for DSC190"
readme = "README.md"
authors = [{name = "Matthew Paoletta", email = "mpaoletta@ucsd.edu"}]
requires-python = ">=3.11"
dependencies = [
    "dateparser>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
